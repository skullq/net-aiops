[project]
name = "net-aiops-backend"
version = "0.1.0"
description = "Net-AIOps Studio FastAPI Backend with NetworkX, Scrapli, and Hier-Config"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "networkx>=3.2",
    "scrapli[community]>=2024.1.30",
    "ntc-templates>=7.0.0",
    "hier-config>=3.0.0",
    "openai>=1.14.0",
    "pydantic>=2.6.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
